<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chatterbox</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap">
<style>
:root{--bg:#f6f5f2;--panel:#fff;--text:#1d1d1b;--mute:#76746e;--line:#e4e2dc;--accent:#5b5bd6;--mine:#5b5bd6;--mineText:#fff;--theirs:#ecebe6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--panel:#1f1f1d;--text:#efeeea;--mute:#9a988f;--line:#333330;--accent:#8b8bf0;--mine:#6b6be0;--theirs:#2d2d2a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--panel:#1f1f1d;--text:#efeeea;--mute:#9a988f;--line:#333330;--accent:#8b8bf0;--mine:#6b6be0;--theirs:#2d2d2a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;height:100%}
aside{width:300px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;flex:none}
.grow{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input,textarea,button{font:inherit;color:inherit}
input,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--accent);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--accent);padding:6px 10px}
.search{padding:10px 14px}
#list{overflow-y:auto;flex:1}
.row{display:flex;gap:10px;align-items:center;padding:10px 14px;cursor:pointer}
.row:hover,.row.on{background:var(--bg)}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.b{max-width:75%;padding:8px 12px;border-radius:16px;background:var(--theirs);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.b.me{background:var(--mine);color:var(--mineText);align-self:flex-end}
.t{font-size:11px;color:var(--mute);margin:0 6px;align-self:flex-start}
.t.me{align-self:flex-end}
form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:var(--panel)}
.empty{margin:auto;color:var(--mute);text-align:center;padding:20px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);width:min(400px,92vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
.emojis{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.emojis span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;cursor:pointer;border:2px solid transparent}
.emojis span.sel{border-color:var(--accent)}
label{font-size:13px;color:var(--mute);display:block;margin:10px 0 4px}
#back{display:none}
@media(max-width:640px){aside{width:100%}main{display:none}#app.chat aside{display:none}#app.chat main{display:flex}#back{display:inline-block}}
[hidden]{display:none!important}
.av{overflow:hidden;font-weight:700}
:root{--g1:#eaf6ec;--g2:#a8d8b4;--bg:#eef7ef;--theirs:#e0eee3;--line:#cfe2d3;--accent:#2f9e5b;--mine:#2f9e5b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#0b1d12;--g2:#1f6b3a;--bg:#10231a;--panel:#13261b;--theirs:#223a2b;--line:#2b4636;--mute:#8fb09c;--accent:#3fb36d;--mine:#2d8f58}}
:root[data-theme="dark"]{--g1:#0b1d12;--g2:#1f6b3a;--bg:#10231a;--panel:#13261b;--theirs:#223a2b;--line:#2b4636;--mute:#8fb09c;--accent:#3fb36d;--mine:#2d8f58}
body{background:linear-gradient(135deg,var(--g1),var(--g2)) fixed}
#meAv,#meName,#pAv,#pName{cursor:pointer}
#prof{width:300px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.banner{height:100px;flex:none}
.pavwrap{padding:0 16px;margin-top:-46px}
#bAv{width:92px;height:92px;font-size:40px;border:6px solid var(--panel)}
.pbody{padding:12px 16px;flex:1}
.pname{font-size:22px;font-weight:700;overflow-wrap:anywhere}
.pbio{margin-top:14px;overflow-wrap:anywhere}
.plabel{font-weight:700;font-size:13px;margin:18px 0 4px}
.pbtn{margin:16px;background:var(--bg);color:var(--text);border:1px solid var(--line)}
.mrow{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.mrow.me{flex-direction:row-reverse;align-self:flex-end}
.mcol{display:flex;flex-direction:column;min-width:0}
.mrow.me .mcol{align-items:flex-end}
.b{max-width:100%}
.av.sm{width:32px;height:32px;font-size:14px;cursor:pointer}
.mname{font-size:12px;color:var(--mute);margin:0 6px 2px}
.t.rd{color:var(--accent);font-weight:600}
@media(max-width:1000px){#prof{display:none!important}}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.pvrow{display:flex;align-items:center;gap:12px;margin:6px 0 12px}
#pv{width:64px;height:64px;font-size:30px}
#auth{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,var(--g1),var(--g2));padding:20px;z-index:5}
#auth .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;width:min(360px,100%)}
#authForm{display:block;border:0;padding:0;background:none}
#authForm input{margin-bottom:10px}
#authForm button{width:100%}
#authMsg{color:#d9534f;min-height:20px;font-size:13px;margin:4px 0}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.mrow.anim{animation:pop .22s ease-out}
.b{transition:opacity .2s,background .2s}
.mrow.pending .b,.mrow.pending .t{opacity:.45}
.mrow.failed .b{background:#d9534f;color:#fff}
.mrow.failed .t{color:#d9534f}
.mrow.typing .b{display:flex;gap:4px;padding:13px 14px}
.mrow.typing .b i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:dot 1.2s infinite}
.mrow.typing .b i:nth-child(2){animation-delay:.15s}
.mrow.typing .b i:nth-child(3){animation-delay:.3s}
#prof{animation:fade .35s}
dialog[open]{animation:pop .2s ease-out}
dialog::backdrop{animation:fade .2s}
.row{transition:background .15s}
.av{transition:transform .15s}
.av.sm:hover,#meAv:hover,#pAv:hover{transform:scale(1.08)}
button{transition:filter .15s,transform .1s}
button:hover{filter:brightness(1.08)}
button:active{transform:scale(.96)}
#f{position:relative}
.pop{position:absolute;bottom:100%;left:14px;margin-bottom:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:pop .15s ease-out;z-index:3}
#emopop{width:min(340px,calc(100% - 28px))}
.eg{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:210px;overflow-y:auto;margin-top:8px}
.eg span{font-size:22px;text-align:center;cursor:pointer;border-radius:6px;padding:2px;transition:transform .1s,background .1s}
.eg span:hover{background:var(--bg);transform:scale(1.2)}
.ai{padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.ai.on,.ai:hover{background:var(--bg)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#msgs{gap:0;padding:12px 0}
:root{--nl:32%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--nl:74%}}
:root[data-theme="dark"]{--nl:74%}
.mg{display:flex;gap:14px;padding:6px 20px 2px;margin-top:10px;transition:background .15s}
.mg:hover{background:rgba(127,127,127,.07)}
.mg .av{width:42px;height:42px;font-size:18px;cursor:pointer;margin-top:2px}
.mc{min-width:0;flex:1}
.mh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mn{font-weight:700;font-size:15.5px;cursor:pointer}
.mn:hover{text-decoration:underline}
.mu,.mtime{color:var(--mute);font-size:12px}
.mt{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45;padding:1px 0;transition:opacity .2s}
.mt.pending{opacity:.4}
.mt.failed{color:#d9534f}
.mt.anim,.mg.anim{animation:pop .22s ease-out}
.fl{font-size:12px}
.rd{font-size:11px;color:var(--accent);font-weight:700;margin:2px 0 0}
.dvd{display:flex;align-items:center;gap:12px;margin:18px 20px 6px;color:var(--mute);font-size:12px;font-weight:600}
.dvd::before,.dvd::after{content:"";flex:1;height:1px;background:var(--line)}
.mrow.typing{margin:8px 20px 4px}
#msgs{gap:3px;padding:16px}
.mrow{align-self:flex-start;align-items:flex-end}
.mrow.first{margin-top:10px}
.mrow.typing{margin:10px 0 0}
.sp{width:32px;flex:none}
.mrow .t{margin:2px 6px 0}
.mname{margin-top:0}
#notifBar{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mute)}
#notifBar button{padding:5px 10px;font-size:13px;flex:none}
.av{overflow:visible;position:relative}
.av img{border-radius:50%}
.pd{position:absolute;right:-2px;bottom:-2px;width:15px;height:15px;border-radius:50%;border:3px solid var(--panel);background:#3ba55d;pointer-events:none}
.pd.idle{background:radial-gradient(circle at 28% 28%,var(--panel) 0 30%,#faa81a 33%)}
.pd.offline{background:radial-gradient(circle,var(--panel) 0 32%,#8a8f98 35%)}
#bAv .pd,#cAv .pd{width:26px;height:26px;border-width:5px;right:2px;bottom:2px}
.row:hover,.row.on{--panel:var(--bg)}
#dlg{max-height:90vh;overflow-y:auto}
#crop{width:min(420px,94vw)}
#cv{width:100%;height:auto;display:block;touch-action:none;cursor:grab;border-radius:10px;background:#fff}
#bpv{height:72px;border-radius:10px;margin-bottom:6px}
#card{overflow:hidden}
.gav{color:#fff;font-size:14px;font-weight:700}
.slabel{padding:10px 14px 4px;font-size:12px;font-weight:700;color:var(--mute);display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:.04em}
.slabel button{padding:2px 8px;font-size:12px;text-transform:none;letter-spacing:0}
#gdlg,#ginfo{max-height:90vh;overflow-y:auto}
.b.img{padding:4px}
.b.img img{display:block;max-width:min(260px,60vw);max-height:300px;border-radius:12px;cursor:zoom-in}
.b .cap{padding:4px 8px 2px;white-space:pre-wrap;overflow-wrap:anywhere}
.att{position:absolute;bottom:100%;left:14px;margin-bottom:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;gap:8px;align-items:center;z-index:3}
</style>
</head>
<body>
<div id="auth" hidden><div class="card">
  <h2 style="margin:0 0 4px">Chatterbox</h2>
  <div class="sub" id="authTitle" style="margin-bottom:14px">Log in to your account</div>
  <form id="authForm"><input id="au" placeholder="Username" autocomplete="username" maxlength="20"><input id="ap" type="password" placeholder="Password" autocomplete="current-password"><div id="authMsg"></div><button id="authBtn">Log in</button></form>
  <div style="text-align:center;margin-top:10px"><button class="ghost" id="toggle" type="button">New here? Create an account</button></div>
  <div style="text-align:center"><button class="ghost" id="cancelAdd" type="button" hidden style="color:var(--mute)">Cancel</button></div>
</div></div>
<div id="app" hidden>
<aside>
  <div class="top"><div class="av" id="meAv"></div><div class="grow"><div class="name" id="meName">…</div><div class="sub">Your profile</div></div><button class="ghost" id="editBtn">Edit</button><button class="ghost" id="acctBtn">Account</button></div>
  <div id="notifBar" hidden><span class="grow">Get alerts when someone messages you</span><button id="notifBtn" type="button">Turn on</button></div>
  <div class="search"><input id="q" placeholder="Search people" autocomplete="off"></div>
  <div id="list"><div class="empty">Loading…</div></div>
</aside>
<main>
  <div class="top" id="chatTop" hidden><button class="ghost" id="back">←</button><div class="av" id="pAv"></div><div class="grow"><div class="name" id="pName"></div><div class="sub" id="pBio"></div></div></div>
  <div id="msgs"><div class="empty">Pick someone from the list to start a conversation.</div></div>
  <form id="f" hidden><button type="button" id="emoBtn" class="ghost" style="font-size:20px;padding:6px 10px">😊</button><button type="button" id="attBtn" class="ghost" title="Send an image" style="font-size:20px;padding:6px 10px">📎</button><input type="file" id="afile" accept="image/*" hidden><textarea id="in" rows="1" placeholder="Write a message…" style="resize:none"></textarea><button>Send</button><div id="attPrev" class="att" hidden></div><div id="emopop" class="pop" hidden><input id="eq" placeholder="Find the perfect emoji" autocomplete="off"><div class="eg" id="eg"></div></div><div id="acpop" class="pop" hidden></div></form>
</main>
<section id="prof" hidden>
  <div class="banner" id="pbanner"></div>
  <div class="pavwrap"><div class="av" id="bAv"></div></div>
  <div class="pbody">
    <div class="pname" id="bName"></div>
    <div class="sub" id="bUser"></div>
    <div class="sub" id="bStatus" style="white-space:normal;margin-top:6px"></div>
    <div class="pbio" id="bBio"></div>
    <div class="plabel">Member since</div>
    <div id="bSince"></div>
    <div class="plabel">User ID</div>
    <div id="bId" style="cursor:pointer" title="Click to copy"></div>
  </div>
  <button class="pbtn" id="bFull" type="button">View Full Profile</button>
</section>
</div>
<dialog id="acct"><h3 style="margin:0 0 8px">Account</h3><div id="acctList"></div><button id="outBtn" type="button" style="width:100%;margin-top:12px;background:#d9534f;color:#fff">Log out</button><div style="text-align:right;margin-top:8px"><button class="ghost" id="acctClose" type="button">Close</button></div></dialog>
<dialog id="card" style="padding:0"><div id="cBanner" style="height:110px"></div><div style="text-align:center;padding:0 20px 20px"><div class="av" id="cAv" style="width:96px;height:96px;font-size:42px;margin:-48px auto 12px;border:5px solid var(--panel)"></div><div class="name" id="cName" style="font-size:20px"></div><div class="sub" id="cUser"></div><div class="sub" id="cStatus" style="margin-top:6px;white-space:normal"></div><div class="sub" id="cId" style="cursor:pointer;margin-top:4px" title="Click to copy"></div><p id="cBio" style="margin:14px 0;overflow-wrap:anywhere"></p><div style="display:flex;gap:8px;justify-content:center"><button class="ghost" id="cClose" type="button">Close</button><button id="cAct" type="button"></button></div></div></dialog>
<dialog id="crop"><h3 id="cropT" style="margin:0 0 10px">Crop</h3><canvas id="cv"></canvas><label>Zoom (drag the image to move it)</label><input type="range" id="zm" min="1" max="4" step="0.01" value="1" style="padding:0"><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="ghost" id="cropCancel" type="button">Cancel</button><button id="cropOk" type="button">Apply</button></div></dialog>
<dialog id="dlg">
  <h3 style="margin:0 0 8px">Your profile</h3>
  <label for="nm">Display name</label><input id="nm" maxlength="30">
  <label>Profile picture</label>
  <div class="pvrow"><div class="av" id="pv"></div><button class="ghost" id="pickImg" type="button">Upload photo</button><button class="ghost" id="rmImg" type="button" style="color:var(--mute)">Remove</button><input type="file" id="file" accept="image/*,.heic,.heif,.avif,.bmp,.svg,.tiff" hidden></div>
  <label>Banner</label>
  <div id="bpv"></div>
  <div class="pvrow" style="margin:0 0 6px"><button class="ghost" id="pickBan" type="button">Upload banner</button><button class="ghost" id="rmBan" type="button" style="color:var(--mute)">Remove</button><input type="color" id="bcol" title="Banner colour" style="width:44px;height:34px;padding:2px;margin-left:auto"><input type="file" id="bfile" accept="image/*,.heic,.heif,.avif,.bmp,.svg,.tiff" hidden></div>
  <label for="bio">Bio</label><input id="bio" maxlength="80" placeholder="A few words about you">
  <label for="st">Status</label><input id="st" maxlength="60" placeholder="What are you up to?">
  <div class="sub" id="myId" style="margin-top:12px;cursor:pointer" title="Click to copy"></div>
  <label style="display:flex;gap:10px;align-items:flex-start;margin-top:16px;color:var(--text);font-size:14px"><input type="checkbox" id="rcpt" style="width:auto;margin-top:4px"><span>Read receipts<br><span class="sub" style="white-space:normal">Let others see when you’ve read their messages. If this is off, you won’t see when they read yours either.</span></span></label>
  <div id="saveMsg" style="color:#d9534f;font-size:13px;min-height:18px;margin-top:10px"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px"><button class="ghost" id="cancel" type="button">Cancel</button><button id="save" type="button">Save</button></div>
</dialog>
<dialog id="lb" style="padding:0;border:0;background:transparent;width:auto;max-width:96vw"><img id="lbImg" alt="" style="display:block;max-width:94vw;max-height:90vh;border-radius:12px;cursor:zoom-out"></dialog>
<input type="file" id="gfile" accept="image/*,.heic,.heif,.avif,.bmp,.svg,.tiff" hidden>
<dialog id="gdlg"><h3 style="margin:0 0 8px">New group</h3>
  <div class="pvrow"><div class="av" id="gpv" style="width:64px;height:64px;font-size:24px"></div><button class="ghost" id="gnPhoto" type="button">Add photo</button><button class="ghost" id="gnRm" type="button" style="color:var(--mute)">Remove</button></div>
  <label for="gname">Group name</label><input id="gname" maxlength="40" placeholder="Weekend plans">
  <label>Add people</label><input id="gq" placeholder="Search people" autocomplete="off"><div id="gpick" style="max-height:220px;overflow-y:auto;margin-top:6px"></div>
  <div id="gmsg" style="color:#d9534f;font-size:13px;min-height:18px;margin-top:8px"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="ghost" id="gCancel" type="button">Cancel</button><button id="gCreate" type="button">Create</button></div>
</dialog>
<dialog id="ginfo"><h3 style="margin:0 0 8px">Group</h3>
  <div class="pvrow"><div class="av" id="gi_av" style="width:64px;height:64px;font-size:24px"></div><button class="ghost" id="gi_photo" type="button">Change photo</button><button class="ghost" id="gi_rmphoto" type="button" style="color:var(--mute)">Remove</button></div>
  <label for="gi_name">Name</label><input id="gi_name" maxlength="40">
  <label>Members</label><div id="gi_members"></div>
  <label>Add people</label><input id="gi_q" placeholder="Search people" autocomplete="off"><div id="gi_pick" style="max-height:160px;overflow-y:auto;margin-top:6px"></div>
  <button id="gi_add" type="button" style="margin-top:8px">Add selected</button>
  <div id="gi_msg" style="color:#d9534f;font-size:13px;min-height:18px;margin-top:8px"></div>
  <div style="display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:6px"><button id="gi_leave" type="button" style="background:#d9534f;color:#fff">Leave group</button><div><button class="ghost" id="gi_close" type="button">Close</button><button id="gi_save" type="button">Save name</button></div></div>
</dialog>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2.58.0";

const C={img:null,s:1,min:1,x:0,y:0,w:0,h:0,ow:0,oh:0,round:false,cb:null};
function openCrop(file,o,cb){
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      Object.assign(C,{img:im,w:o.w,h:o.h,ow:o.ow,oh:o.oh,round:!!o.round,cb});
      const cv=$("cv");cv.width=C.w;cv.height=C.h;
      C.min=Math.max(C.w/im.width,C.h/im.height);C.s=C.min;C.x=(C.w-im.width*C.s)/2;C.y=(C.h-im.height*C.s)/2;

    };
    im.onerror=()=>alert("Your browser couldn’t open that file. Try a JPG, PNG, GIF, WebP or SVG image.");
    im.src=r.result;
  };
  r.readAsDataURL(file);
}
function drawCrop(){
  const iw=C.img.width*C.s,ih=C.img.height*C.s;
  C.x=Math.min(0,Math.max(C.w-iw,C.x));C.y=Math.min(0,Math.max(C.h-ih,C.y));
  const x=$("cv").getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,C.w,C.h);x.drawImage(C.img,C.x,C.y,iw,ih);
  if(C.round){
    x.fillStyle="rgba(0,0,0,.55)";x.beginPath();x.rect(0,0,C.w,C.h);x.arc(C.w/2,C.h/2,C.w/2-3,0,Math.PI*2,true);x.fill("evenodd");
    x.strokeStyle="rgba(255,255,255,.9)";x.lineWidth=2;x.beginPath();x.arc(C.w/2,C.h/2,C.w/2-3,0,Math.PI*2);x.stroke();
  }
}
$("zm").oninput=()=>{

    const{data,error}=await sb.from("profiles").update(row).eq("id",me).select();
    if(error){
      sm.textContent=/column|schema cache/i.test(error.message)?"Couldn’t save: the new profile fields aren’t in your database yet. Run the new SQL in Supabase, then try again.":"Couldn’t save: "+error.message;return}
    if(!data||!data.length){sm.textContent="Couldn’t save: no permission to update your profile. Re-run the fix SQL in Supabase.";return}
    P[me]={...P[me],...row};renderMe();renderList();$("dlg").close();
  }catch(e){sm.textContent="Couldn’t save: "+(e.message||e)}
  finally{$("save").disabled=false}
};
function showCard(uid){
  const p=P[uid]||{};avatar($("cAv"),p,uid);bannerStyle($("cBanner"),p,uid);
  $("cName").textContent=p.name||"";$("cUser").textContent="@"+(p.username||"");
  $("cStatus").textContent=p.status_text||"";$("cStatus").hidden=!p.status_text;
  $("cId").textContent="ID "+idOf(p,uid);$("cId").onclick=()=>copyId($("cId"),idOf(p,uid));
  $("cBio").textContent=p.bio||(uid===me?"You haven’t added a bio yet.":"No bio yet.");
  const b=$("cAct");b.textContent=uid===me?"Edit profile":"Send message";
  b.onclick=()=>{$("card").close();if(uid===me)openEditor();else openChat(uid)};
  $("card").showModal();
}
function openAcct(){
  const p=P[me]||{},box=$("acctList");box.textContent="";
  const r=mk("div","row on"),a=mk("div","av"),w=mk("div","grow");r.style.borderRadius="10px";avatar(a,p,me);
  w.append(mk("div","name",p.name||""),mk("div","sub","@"+(p.username||"")+" · signed in"));r.append(a,w);box.append(r);
  $("acct").showModal();
}
$("editBtn").onclick=openEditor;$("acctBtn").onclick=openAcct;
$("acctClose").onclick=()=>$("acct").close();$("cClose").onclick=()=>$("card").close();
$("outBtn").onclick=async()=>{await sb.auth.signOut();location.reload()};
$("meAv").onclick=$("meName").onclick=()=>showCard(me);
$("pAv").onclick=$("pName").onclick=()=>{if(active)showCard(active);else if(activeG)openGroupInfo()};
$("bFull").onclick=()=>{if(active)showCard(active)};

// ---- group chats ----
function closeChatView(){
  active=null;activeG=null;msgs=[];$("chatTop").hidden=true;$("f").hidden=true;$("prof").hidden=true;$("app").classList.remove("chat");
  $("msgs").textContent="";$("msgs").append(mk("div","empty","Pick someone from the list to start a conversation."));renderList();
}
async function loadGroups(){
  const[g,m]=await Promise.all([sb.from("groups").select("*"),sb.from("group_members").select("group_id,user_id")]);
  if(g.error||m.error)return;
  const n={};(g.data||[]).forEach(x=>n[x.id]={...x,members:[]});
  (m.data||[]).forEach(x=>{if(n[x.group_id])n[x.group_id].members.push(x.user_id)});
  Object.keys(n).forEach(k=>{if(!n[k].members.includes(me))delete n[k]});
  G=n;renderList();
  if(activeG){if(G[activeG]){renderGroupHead();if($("ginfo").open)renderGroupInfo()}else closeChatView()}
}
function loadGroupsSoon(){clearTimeout(gT);gT=setTimeout(loadGroups,300)}
function startGroupLive(){
  sb.channel("live-groups")
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"group_messages"},x=>incomingG(x.new))
    .on("postgres_changes",{event:"*",schema:"public",table:"group_members"},loadGroupsSoon)
    .on("postgres_changes",{event:"*",schema:"public",table:"groups"},loadGroupsSoon)
    .subscribe();
}
function incomingG(m){
  if(!G[m.group_id])loadGroupsSoon();
  notify(m);
  if(m.group_id!==activeG||msgs.some(x=>x.id===m.id))return;
  msgs.push(m);renderMsgs();
}
function renderGroupHead(){
  const g=G[activeG];if(!g)return;
  setGroupAv($("pAv"),g);$("pName").textContent=g.name;
  $("pBio").textContent=g.members.length+" members · "+g.members.map(id=>id===me?"You":(P[id]||{}).name||"?").join(", ");
}
async function openGroup(gid){
  const g=G[gid];if(!g)return;
  clearAtt();active=null;activeG=gid;msgs=[];otherRead=0;lastMine=null;seen=new Set();typingOn=false;clearTimeout(typingTimer);
  if(tch){sb.removeChannel(tch);tch=null}tReady=false;
  renderList();renderGroupHead();
  $("prof").hidden=true;$("chatTop").hidden=false;$("f").hidden=false;$("app").classList.add("chat");$("msgs").textContent="";
  const r=await sb.from("group_messages").select("*").eq("group_id",gid).order("created_at").limit(300);
  if(activeG!==gid)return;
  if(r.error){$("msgs").append(mk("div","empty","Couldn’t load messages."));return}
  msgs=r.data||[];msgs.forEach(x=>seen.add(x.id));renderMsgs();$("in").focus();
}
function drawPick(box,qEl,sel,excl){
  const q=qEl.value.toLowerCase(),skip=new Set([me,...(excl||[])]);box.textContent="";
  Object.values(P).filter(p=>!skip.has(p.id)&&(p.name+" "+p.username).toLowerCase().includes(q)).forEach(p=>{
    const r=mk("div","row"),a=mk("div","av"),w=mk("div","grow"),c=mk("input");
    c.type="checkbox";c.style.width="auto";c.checked=sel.has(p.id);avatar(a,p,p.id,true);
    w.append(mk("div","name",p.name),mk("div","sub","@"+p.username));r.append(a,w,c);
    r.onclick=e=>{if(e.target!==c)c.checked=!c.checked;if(c.checked)sel.add(p.id);else sel.delete(p.id)};
    box.append(r);
  });
}
function openNewGroup(){
  gsel=new Set();gnBlob=null;gnUrl="";$("gname").value="";$("gq").value="";$("gmsg").textContent="";drawGnAv();
  drawPick($("gpick"),$("gq"),gsel);$("gdlg").showModal();
}
$("gq").oninput=()=>drawPick($("gpick"),$("gq"),gsel);
$("gCancel").onclick=()=>$("gdlg").close();
$("gCreate").onclick=async()=>{
  const name=$("gname").value.trim(),sm=$("gmsg");sm.textContent="";
  if(!name){$("gname").focus();return}
  if(!gsel.size){sm.textContent="Pick at least one person.";return}
  $("gCreate").disabled=true;
  try{
    const r=await sb.from("groups").insert({name}).select().single();
    if(r.error)throw r.error;
    const m=await sb.from("group_members").insert([me,...gsel].map(u=>({group_id:r.data.id,user_id:u})));
    if(m.error)throw m.error;
    if(gnBlob){const pr=await uploadGroupPhoto(r.data.id,gnBlob,gnUrl);if(pr.error)console.warn("Group photo failed:",pr.error.message)}
    $("gdlg").close();await loadGroups();openGroup(r.data.id);
  }catch(e){
    const t=(e&&e.message)||String(e);
    sm.textContent=/relation|schema cache|does not exist/i.test(t)?"Group chats aren’t set up in your database yet. Run the group chat SQL in Supabase, then try again.":"Couldn’t create group: "+t;
  }finally{$("gCreate").disabled=false}
};
function openGroupInfo(){
  const g=G[activeG];if(!g)return;
  $("gi_name").value=g.name;$("gi_msg").textContent="";gsel2=new Set();$("gi_q").value="";
  renderGroupInfo();$("ginfo").showModal();
}
function renderGroupInfo(){
  const g=G[activeG];if(!g)return;setGroupAv($("gi_av"),g);const box=$("gi_members");box.textContent="";
  g.members.forEach(id=>{
    const p=P[id]||{},r=mk("div","row"),a=mk("div","av"),w=mk("div","grow");avatar(a,p,id);
    w.append(mk("div","name",(id===me?"You":p.name||"?")+(id===g.created_by?" · creator":"")),mk("div","sub","@"+(p.username||"")));
    r.append(a,w);
    if(g.created_by===me&&id!==me){
      const b=mk("button","ghost","Remove");b.type="button";b.style.color="#d9534f";
      b.onclick=async()=>{
        const x=await sb.from("group_members").delete().eq("group_id",g.id).eq("user_id",id).select();
        if(x.error||!x.data||!x.data.length)$("gi_msg").textContent="Couldn’t remove that person.";
        else{await loadGroups();renderGroupInfo()}
      };
      r.append(b);
    }
    box.append(r);
  });
  drawPick($("gi_pick"),$("gi_q"),gsel2,g.members);
}
$("gi_q").oninput=()=>{const g=G[activeG];if(g)drawPick($("gi_pick"),$("gi_q"),gsel2,g.members)};
$("gi_add").onclick=async()=>{
  const g=G[activeG],sm=$("gi_msg");sm.textContent="";if(!g||!gsel2.size)return;
  const r=await sb.from("group_members").insert([...gsel2].map(u=>({group_id:g.id,user_id:u})));
  if(r.error){sm.textContent="Couldn’t add: "+r.error.message;return}
  gsel2=new Set();await loadGroups();renderGroupInfo();
};
$("gi_save").onclick=async()=>{
  const g=G[activeG],sm=$("gi_msg"),name=$("gi_name").value.trim();sm.textContent="";if(!g||!name)return;
  const r=await sb.from("groups").update({name}).eq("id",g.id).select();
  if(r.error||!r.data||!r.data.length){sm.textContent="Couldn’t rename the group.";return}
  await loadGroups();$("ginfo").close();
};
$("gi_leave").onclick=async()=>{
  const g=G[activeG];if(!g)return;
  if(!confirm("Leave “"+g.name+"”?"))return;
  const r=await sb.from("group_members").delete().eq("group_id",g.id).eq("user_id",me);
  if(r.error){$("gi_msg").textContent="Couldn’t leave: "+r.error.message;return}
  $("ginfo").close();await loadGroups();
};
$("gi_close").onclick=()=>$("ginfo").close();
function drawGnAv(){setGroupAv($("gpv"),{id:"new",name:$("gname").value||"?",avatar_url:gnUrl})}
$("gname").oninput=drawGnAv;
async function uploadGroupPhoto(gid,blob,dataUrl){
  const path=me+"/group-"+gid+"-"+Date.now()+".jpg";
  const u=await sb.storage.from("avatars").upload(path,blob,{contentType:"image/jpeg"});
  const url=u.error?dataUrl:sb.storage.from("avatars").getPublicUrl(path).data.publicUrl;
  return sb.from("groups").update({avatar_url:url}).eq("id",gid).select();
}
const photoErr=r=>r.error?(/column|schema cache|permission/i.test(r.error.message)?"Couldn’t save the photo: run the group photo SQL in Supabase first.":"Couldn’t save the photo: "+r.error.message):(!r.data||!r.data.length?"Couldn’t save the photo.":"");
$("gnPhoto").onclick=()=>{gTarget="new";$("gfile").click()};
$("gnRm").onclick=()=>{gnBlob=null;gnUrl="";drawGnAv()};
$("gi_photo").onclick=()=>{gTarget="info";$("gfile").click()};
$("gi_rmphoto").onclick=async()=>{
  const g=G[activeG];if(!g)return;
  const r=await sb.from("groups").update({avatar_url:null}).eq("id",g.id).select(),m=photoErr(r);
  $("gi_msg").textContent=m;if(!m)await loadGroups();
};
$("gfile").onchange=e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  const tgt=gTarget;
  openCrop(f,{title:"Crop group photo",w:320,h:320,ow:256,oh:256,round:true},async(b,u)=>{
    if(tgt==="new"){gnBlob=b;gnUrl=u;drawGnAv();return}
    const g=G[activeG];if(!g)return;const sm=$("gi_msg");sm.textContent="Saving photo…";
    const r=await uploadGroupPhoto(g.id,b,u),m=photoErr(r);
    sm.textContent=m;if(!m)await loadGroups();
  });
};

// ---- presence (online / idle / offline) ----
function updDots(){document.querySelectorAll(".pd[data-u]").forEach(d=>{const t=stateOf(d.dataset.u);d.className="pd "+t;d.title=stLabel[t]})}
function setMyState(t){if(t===myState)return;myState=t;if(pch)pch.track({state:t});updDots()}
function startPresence(){
  if(pch)return;
  pch=sb.channel("presence",{config:{presence:{key:me}}});
  let sig="";
  pch.on("presence",{event:"sync"},()=>{
    const st=pch.presenceState(),n={};
    for(const k in st)n[k]=st[k].some(m=>m.state==="online")?"online":"idle";
    pres=n;updDots();const j=JSON.stringify(n);if(j!==sig){sig=j;renderList()}
  }).subscribe(t=>{if(t==="SUBSCRIBED")pch.track({state:myState})});
}
["pointerdown","keydown","mousemove","touchstart","wheel"].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now();if(myState==="idle")setMyState("online")},{passive:true}));
setInterval(()=>{if(myState==="online"&&Date.now()-lastAct>3e5)setMyState("idle")},15000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){lastAct=Date.now();setMyState("online")}});
addEventListener("pagehide",()=>{if(pch)pch.untrack()});

// ---- start ----
async function start(id){
  me=id;$("auth").hidden=true;$("app").hidden=false;syncNotif();startPresence();
  const{data,error}=await sb.from("profiles").select("*");
  if(error){$("list").textContent="Couldn’t load people.";return}
  P={};data.forEach(p=>P[p.id]=p);renderMe();renderList();loadGroups();startGroupLive();
  sb.channel("live")
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"recipient=eq."+me},x=>incoming(x.new))
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"sender=eq."+me},x=>incoming(x.new))
    .on("postgres_changes",{event:"*",schema:"public",table:"reads",filter:"other=eq."+me},x=>{
      if(x.new&&x.new.reader===active){otherRead=Date.parse(x.new.last_read);placeRead()}})
    .on("postgres_changes",{event:"*",schema:"public",table:"profiles"},x=>{
      if(x.new&&x.new.id){P[x.new.id]=x.new;renderMe();renderList();if(active){renderHead();placeRead()}}})
    .subscribe();
}
async function init(){
  if(SUPABASE_URL.includes("YOUR-PROJECT")){$("auth").hidden=false;msg("Set SUPABASE_URL at the top of the script first.");return}
  sb=createClient(SUPABASE_URL,KEY);
  const{data:{session}}=await sb.auth.getSession();
  if(session)start(session.user.id);else $("auth").hidden=false;
}
init();
</script>
