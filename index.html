<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Chatterbox</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap">
<style>
:root{--bg:#f6f5f2;--panel:#fff;--text:#1d1d1b;--mute:#76746e;--line:#e4e2dc;--accent:#5b5bd6;--mine:#5b5bd6;--mineText:#fff;--theirs:#ecebe6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--panel:#1f1f1d;--text:#efeeea;--mute:#9a988f;--line:#333330;--accent:#8b8bf0;--mine:#6b6be0;--theirs:#2d2d2a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--panel:#1f1f1d;--text:#efeeea;--mute:#9a988f;--line:#333330;--accent:#8b8bf0;--mine:#6b6be0;--theirs:#2d2d2a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;height:100%}
aside{width:300px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;flex:none}
.grow{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input,textarea,button{font:inherit;color:inherit}
input,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--accent);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--accent);padding:6px 10px}
.search{padding:10px 14px}
#list{overflow-y:auto;flex:1}
.row{display:flex;gap:10px;align-items:center;padding:10px 14px;cursor:pointer}
.row:hover,.row.on{background:var(--bg)}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.b{max-width:75%;padding:8px 12px;border-radius:16px;background:var(--theirs);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.b.me{background:var(--mine);color:var(--mineText);align-self:flex-end}
.t{font-size:11px;color:var(--mute);margin:0 6px;align-self:flex-start}
.t.me{align-self:flex-end}
form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:var(--panel)}
.empty{margin:auto;color:var(--mute);text-align:center;padding:20px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);width:min(400px,92vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
.emojis{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.emojis span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;cursor:pointer;border:2px solid transparent}
.emojis span.sel{border-color:var(--accent)}
label{font-size:13px;color:var(--mute);display:block;margin:10px 0 4px}
#back{display:none}
@media(max-width:640px){aside{width:100%}main{display:none}#app.chat aside{display:none}#app.chat main{display:flex}#back{display:inline-block}}
[hidden]{display:none!important}
.av{overflow:hidden;font-weight:700}
:root{--g1:#eaf6ec;--g2:#a8d8b4;--bg:#eef7ef;--theirs:#e0eee3;--line:#cfe2d3;--accent:#2f9e5b;--mine:#2f9e5b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#0b1d12;--g2:#1f6b3a;--bg:#10231a;--panel:#13261b;--theirs:#223a2b;--line:#2b4636;--mute:#8fb09c;--accent:#3fb36d;--mine:#2d8f58}}
:root[data-theme="dark"]{--g1:#0b1d12;--g2:#1f6b3a;--bg:#10231a;--panel:#13261b;--theirs:#223a2b;--line:#2b4636;--mute:#8fb09c;--accent:#3fb36d;--mine:#2d8f58}
body{background:linear-gradient(135deg,var(--g1),var(--g2)) fixed}
#meAv,#meName,#pAv,#pName{cursor:pointer}
#prof{width:300px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.banner{height:100px;flex:none}
.pavwrap{padding:0 16px;margin-top:-46px}
#bAv{width:92px;height:92px;font-size:40px;border:6px solid var(--panel)}
.pbody{padding:12px 16px;flex:1}
.pname{font-size:22px;font-weight:700;overflow-wrap:anywhere}
.pbio{margin-top:14px;overflow-wrap:anywhere}
.plabel{font-weight:700;font-size:13px;margin:18px 0 4px}
.pbtn{margin:16px;background:var(--bg);color:var(--text);border:1px solid var(--line)}
.mrow{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.mrow.me{flex-direction:row-reverse;align-self:flex-end}
.mcol{display:flex;flex-direction:column;min-width:0}
.mrow.me .mcol{align-items:flex-end}
.b{max-width:100%}
.av.sm{width:32px;height:32px;font-size:14px;cursor:pointer}
.mname{font-size:12px;color:var(--mute);margin:0 6px 2px}
.t.rd{color:var(--accent);font-weight:600}
@media(max-width:1000px){#prof{display:none!important}}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.pvrow{display:flex;align-items:center;gap:12px;margin:6px 0 12px}
#pv{width:64px;height:64px;font-size:30px}
#auth{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,var(--g1),var(--g2));padding:20px;z-index:5}
#auth .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;width:min(360px,100%)}
#authForm{display:block;border:0;padding:0;background:none}
#authForm input{margin-bottom:10px}
#authForm button{width:100%}
#authMsg{color:#d9534f;min-height:20px;font-size:13px;margin:4px 0}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.mrow.anim{animation:pop .22s ease-out}
.b{transition:opacity .2s,background .2s}
.mrow.pending .b,.mrow.pending .t{opacity:.45}
.mrow.failed .b{background:#d9534f;color:#fff}
.mrow.failed .t{color:#d9534f}
.mrow.typing .b{display:flex;gap:4px;padding:13px 14px}
.mrow.typing .b i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:dot 1.2s infinite}
.mrow.typing .b i:nth-child(2){animation-delay:.15s}
.mrow.typing .b i:nth-child(3){animation-delay:.3s}
#prof{animation:fade .35s}
dialog[open]{animation:pop .2s ease-out}
dialog::backdrop{animation:fade .2s}
.row{transition:background .15s}
.av{transition:transform .15s}
.av.sm:hover,#meAv:hover,#pAv:hover{transform:scale(1.08)}
button{transition:filter .15s,transform .1s}
button:hover{filter:brightness(1.08)}
button:active{transform:scale(.96)}
#f{position:relative}
.pop{position:absolute;bottom:100%;left:14px;margin-bottom:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:pop .15s ease-out;z-index:3}
#emopop{width:min(340px,calc(100% - 28px))}
.eg{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:210px;overflow-y:auto;margin-top:8px}
.eg span{font-size:22px;text-align:center;cursor:pointer;border-radius:6px;padding:2px;transition:transform .1s,background .1s}
.eg span:hover{background:var(--bg);transform:scale(1.2)}
.ai{padding:6px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.ai.on,.ai:hover{background:var(--bg)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#msgs{gap:0;padding:12px 0}
:root{--nl:32%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--nl:74%}}
:root[data-theme="dark"]{--nl:74%}
.mg{display:flex;gap:14px;padding:6px 20px 2px;margin-top:10px;transition:background .15s}
.mg:hover{background:rgba(127,127,127,.07)}
.mg .av{width:42px;height:42px;font-size:18px;cursor:pointer;margin-top:2px}
.mc{min-width:0;flex:1}
.mh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mn{font-weight:700;font-size:15.5px;cursor:pointer}
.mn:hover{text-decoration:underline}
.mu,.mtime{color:var(--mute);font-size:12px}
.mt{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45;padding:1px 0;transition:opacity .2s}
.mt.pending{opacity:.4}
.mt.failed{color:#d9534f}
.mt.anim,.mg.anim{animation:pop .22s ease-out}
.fl{font-size:12px}
.rd{font-size:11px;color:var(--accent);font-weight:700;margin:2px 0 0}
.dvd{display:flex;align-items:center;gap:12px;margin:18px 20px 6px;color:var(--mute);font-size:12px;font-weight:600}
.dvd::before,.dvd::after{content:"";flex:1;height:1px;background:var(--line)}
.mrow.typing{margin:8px 20px 4px}
#msgs{gap:3px;padding:16px}
.mrow{align-self:flex-start;align-items:flex-end}
.mrow.first{margin-top:10px}
.mrow.typing{margin:10px 0 0}
.sp{width:32px;flex:none}
.mrow .t{margin:2px 6px 0}
.mname{margin-top:0}
#notifBar{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mute)}
#notifBar button{padding:5px 10px;font-size:13px;flex:none}
.av{overflow:visible;position:relative}
.av img{border-radius:50%}
.pd{position:absolute;right:-2px;bottom:-2px;width:15px;height:15px;border-radius:50%;border:3px solid var(--panel);background:#3ba55d;pointer-events:none}
.pd.idle{background:radial-gradient(circle at 28% 28%,var(--panel) 0 30%,#faa81a 33%)}
.pd.offline{background:radial-gradient(circle,var(--panel) 0 32%,#8a8f98 35%)}
#bAv .pd,#cAv .pd{width:26px;height:26px;border-width:5px;right:2px;bottom:2px}
.row:hover,.row.on{--panel:var(--bg)}
#dlg{max-height:90vh;overflow-y:auto}
#crop{width:min(420px,94vw)}
#cv{width:100%;height:auto;display:block;touch-action:none;cursor:grab;border-radius:10px;background:#fff}
#bpv{height:72px;border-radius:10px;margin-bottom:6px}
#card{overflow:hidden}
.gav{color:#fff;font-size:14px;font-weight:700}
.slabel{padding:10px 14px 4px;font-size:12px;font-weight:700;color:var(--mute);display:flex;justify-content:space-between;align-items:center;text-transform:uppercase;letter-spacing:.04em}
.slabel button{padding:2px 8px;font-size:12px;text-transform:none;letter-spacing:0}
#gdlg,#ginfo{max-height:90vh;overflow-y:auto}
.b.img{padding:4px}
.b.img img{display:block;max-width:min(260px,60vw);max-height:300px;border-radius:12px;cursor:zoom-in}
.b .cap{padding:4px 8px 2px;white-space:pre-wrap;overflow-wrap:anywhere}
.att{position:absolute;bottom:100%;left:14px;margin-bottom:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;gap:8px;align-items:center;z-index:3}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:20;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:#262625;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.3);animation:pop .2s ease-out}
.toast.err{background:#d9534f}
dialog.page{position:fixed!important;inset:0 0 0 300px!important;width:auto!important;max-width:none!important;height:auto!important;max-height:none!important;margin:0!important;border:0!important;border-radius:0!important;z-index:4;overflow-y:auto;padding:28px 24px!important}
dialog.page>*{max-width:560px;margin-left:auto;margin-right:auto}
#card.page{padding:0!important}
@media(max-width:640px){dialog.page{inset:0!important}}
#gpanel{width:300px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto;padding:14px 16px;animation:fade .25s}
@media(max-width:1000px){#gpanel{position:fixed;inset:0;width:100%;z-index:6;border:0}}
.b.invw{padding:0;background:transparent;color:var(--text)}
.inv{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;width:min(300px,70vw);color:var(--text);white-space:normal}
.invr{display:flex;align-items:center;gap:10px;margin:10px 0}
.invb{width:100%}
.invb:disabled{background:var(--bg);color:var(--mute);cursor:default;filter:none;transform:none}
.stack{display:flex;flex:none}
.stack .av{margin-left:-10px;border:2px solid var(--panel)}
.stack .av:first-child{margin-left:0}
.chip{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:99px;background:var(--bg);border:1px solid var(--line);cursor:pointer;font-size:13px}
.chip .av{width:22px;height:22px;font-size:11px}

#shorts{position:fixed;inset:0;z-index:8;display:flex;background:#000;color:#fff}
#svMain{flex:1;position:relative;min-width:0;display:flex;justify-content:center;background:#0b0b0b}
#svFeed{height:100%;width:min(100%,calc(100dvh*9/16));overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
#svFeed::-webkit-scrollbar{display:none}
.sv{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;background:#000;overflow:hidden}
.sv video{width:100%;height:100%;object-fit:contain;display:block;cursor:pointer}
.svb{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));z-index:3;width:42px;height:42px;padding:0;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:20px}
#svBack{left:12px}#svMute{right:12px}
.svrail{position:absolute;right:10px;bottom:110px;display:flex;flex-direction:column;gap:14px;align-items:center;z-index:2}
.svrail div{text-align:center;font-size:12px;font-weight:700;text-shadow:0 1px 3px #000}
.svrail button{background:rgba(0,0,0,.5);border-radius:50%;width:48px;height:48px;padding:0;font-size:22px;color:#fff;display:block;margin:0 auto 2px}
.svrail button.on{background:rgba(217,83,79,.9)}
.svcap{position:absolute;left:14px;right:78px;bottom:26px;z-index:2;text-shadow:0 1px 4px #000;overflow-wrap:anywhere;pointer-events:none}
.svcap b{display:block;margin-bottom:2px}

.svnone{margin:auto;color:#aaa;text-align:center;padding:20px;height:100%;display:grid;place-items:center}
#svSide{width:320px;flex:none;background:var(--panel);color:var(--text);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}

#svCl{flex:1;overflow-y:auto;padding:4px 16px;min-height:60px}
.scm{display:flex;gap:8px;margin:10px 0;align-items:flex-start}
.scm .av{width:30px;height:30px;font-size:13px}

@media(max-width:1000px){
 #svSide{position:fixed;left:0;right:0;bottom:0;width:100%;height:72%;border:0;border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .25s;z-index:9;box-shadow:0 -8px 30px rgba(0,0,0,.4)}
 #svSide.open{transform:none}
 #svSheetX{display:inline-block}
}
#svUpd{width:min(440px,94vw);max-height:92vh;overflow-y:auto}
#svPv{width:100%;max-height:260px;border-radius:10px;background:#000;display:block;margin:8px 0}

<body>
<div id="auth" hidden><div class="card">
  <h2 style="margin:0 0 4px">Chatterbox</h2>
  <div class="sub" id="authTitle" style="margin-bottom:14px">Log in to your account</div>
  <form id="authForm"><input id="au" placeholder="Username" autocomplete="username" maxlength="20"><input id="ap" type="password" placeholder="Password" autocomplete="current-password"><div id="authMsg"></div><button id="authBtn">Log in</button></form>
  <div style="text-align:center;margin-top:10px"><button class="ghost" id="toggle" type="button">New here? Create an account</button></div>
  <div style="text-align:center"><button class="ghost" id="cancelAdd" type="button" hidden style="color:var(--mute)">Cancel</button></div>
</div></div>
<div id="app" hidden>
<aside>
  <div class="top"><div class="av" id="meAv"></div><div class="grow"><div class="name" id="meName">…</div><div class="sub">Your profile</div></div><button class="ghost ib" id="editBtn" title="Edit profile"><span data-i="pencil"></span></button><button class="ghost ib" id="bellBtn" title="Notifications"><span data-i="bell"></span></button><button class="ghost ib" id="acctBtn" title="Account"><span data-i="user"></span></button></div>
  <div id="notifBar" hidden><span class="grow">Get alerts when someone messages you</span><button id="notifBtn" type="button">Turn on</button></div>
  <div class="nav"><button class="navb on" id="navChats" type="button"><span data-i="message"></span>Chats</button><button class="navb" id="navShorts" type="button"><span data-i="film"></span>Shorts</button><button class="navup" id="navUpload" type="button" title="Upload a short"><span data-i="plus" data-s="22"></span></button></div>
  <div class="search"><input id="q" placeholder="Search people" autocomplete="off"></div>
  <div id="list"><div class="empty">Loading…</div></div>
</aside>
<main>
  <div class="top" id="chatTop" hidden><button class="ghost" id="back"><span data-i="arrowleft"></span></button><div class="av" id="pAv"></div><div class="grow"><div class="name" id="pName"></div><div class="sub" id="pBio"></div></div><button class="ghost ib" id="callBtn" title="Start a voice call"><span data-i="phone" data-s="20"></span></button></div>
  <div id="msgs"><div class="empty">Pick someone from the list to start a conversation.</div></div>
  <form id="f" hidden><button type="button" id="emoBtn" class="ghost" style="font-size:20px;padding:6px 10px"><span data-i="smile" data-s="22"></span></button><button type="button" id="attBtn" class="ghost" title="Send an image" style="font-size:20px;padding:6px 10px"><span data-i="clip" data-s="22"></span></button><input type="file" id="afile" accept="image/*" hidden><textarea id="in" rows="1" placeholder="Write a message…" style="resize:none"></textarea><button>Send</button><div id="attPrev" class="att" hidden></div><div id="emopop" class="pop" hidden><input id="eq" placeholder="Find the perfect emoji" autocomplete="off"><div class="eg" id="eg"></div></div><div id="acpop" class="pop" hidden></div></form>
</main>
<section id="prof" hidden>
  <div class="banner" id="pbanner"></div>
  <div class="pavwrap"><div class="av" id="bAv"></div></div>
  <div class="pbody">
    <div class="pname" id="bName"></div>
    <div class="sub" id="bUser"></div>
    <div class="sub" id="bStatus" style="white-space:normal;margin-top:6px"></div>
    <div class="pbio" id="bBio"></div>
    <div class="plabel">Member since</div>
    <div id="bSince"></div>
    <div class="plabel">User ID</div>
    <div id="bId" style="cursor:pointer" title="Click to copy"></div>
    <div id="bMut"></div>
  </div>
  <button class="pbtn" id="bFriend" type="button" style="margin-bottom:0"></button>
  <button class="pbtn" id="bFull" type="button">View Full Profile</button>
  <button class="pbtn" id="bShorts" type="button" style="margin-top:0"><span data-i="film"></span>Shorts</button>
</section>
<section id="gpanel" hidden>
  <div style="display:flex;align-items:center;justify-content:space-between"><h3 style="margin:0">Group settings</h3><button class="ghost" id="gi_close" type="button" title="Close"><span data-i="x"></span></button></div>
  <div class="pvrow" style="margin-top:12px"><div class="av" id="gi_av" style="width:64px;height:64px;font-size:24px"></div><button class="ghost" id="gi_photo" type="button">Change photo</button><button class="ghost" id="gi_rmphoto" type="button" style="color:var(--mute)">Remove</button></div>
  <label for="gi_name">Name</label><div style="display:flex;gap:8px"><input id="gi_name" maxlength="40"><button id="gi_save" type="button">Save</button></div>
  <label>Members</label><div id="gi_members"></div>
  <label>Add people</label><input id="gi_q" placeholder="Search people" autocomplete="off"><div id="gi_pick" style="max-height:160px;overflow-y:auto;margin-top:6px"></div>
  <button id="gi_add" type="button" style="margin-top:8px">Add selected</button>
  <div id="gi_msg" style="color:#d9534f;font-size:13px;min-height:18px;margin-top:8px"></div>
  <div style="margin-top:auto;padding-top:14px">
    <button id="gi_leave" type="button" style="width:100%;background:#d9534f;color:#fff">Leave group</button>
    <div id="gi_confirm" hidden style="display:flex;gap:8px;align-items:center;justify-content:space-between"><span style="font-weight:600">Leave this group?</span><div><button class="ghost" id="gi_no" type="button" style="color:var(--mute)">Cancel</button><button id="gi_yes" type="button" style="background:#d9534f;color:#fff">Yes, leave</button></div></div>
  </div>
</section>
</div>
<dialog id="acct" class="page"><h3 style="margin:0 0 8px">Account</h3><div id="acctList"></div><button id="outBtn" type="button" style="width:100%;margin-top:12px;background:#d9534f;color:#fff">Log out</button><div style="text-align:right;margin-top:8px"><button class="ghost" id="acctClose" type="button">Close</button></div></dialog>
<dialog id="card" class="page" style="padding:0"><div id="cBanner" style="height:110px"></div><div style="text-align:center;padding:0 20px 20px"><div class="av" id="cAv" style="width:96px;height:96px;font-size:42px;margin:-48px auto 12px;border:5px solid var(--panel)"></div><div class="name" id="cName" style="font-size:20px"></div><div class="sub" id="cUser"></div><div class="sub" id="cStatus" style="margin-top:6px;white-space:normal"></div><div class="sub" id="cId" style="cursor:pointer;margin-top:4px" title="Click to copy"></div><p id="cBio" style="margin:14px 0;overflow-wrap:anywhere"></p><div id="cMut" style="margin:0 0 14px;text-align:left"></div><div style="display:flex;gap:8px;justify-content:center"><button class="ghost" id="cClose" type="button">Close</button><button class="ghost" id="cShorts" type="button"><span data-i="film"></span>Shorts</button><button class="ghost" id="cFriend" type="button"></button><button id="cAct" type="button"></button></div></div></dialog>
<dialog id="crop"><h3 id="cropT" style="margin:0 0 10px">Crop</h3><canvas id="cv"></canvas><label>Zoom (drag the image to move it)</label><input type="range" id="zm" min="1" max="4" step="0.01" value="1" style="padding:0"><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="ghost" id="cropCancel" type="button">Cancel</button><button id="cropOk" type="button">Apply</button></div></dialog>
<dialog id="dlg" class="page">
  <h3 style="margin:0 0 8px">Your profile</h3>
  <label for="nm">Display name</label><input id="nm" maxlength="30">
  <label>Profile picture</label>
  <div class="pvrow"><div class="av" id="pv"></div><button class="ghost" id="pickImg" type="button">Upload photo</button><button class="ghost" id="rmImg" type="button" style="color:var(--mute)">Remove</button><input type="file" id="file" accept="image/*,.heic,.heif,.avif,.bmp,.svg,.tiff" hidden></div>
  <label>Banner</label>
  <div id="bpv"></div>
  <div class="pvrow" style="margin:0 0 6px"><button class="ghost" id="pickBan" type="button">Upload banner</button><button class="ghost" id="rmBan" type="button" style="color:var(--mute)">Remove</button><input type="color" id="bcol" title="Banner colour" style="width:44px;height:34px;padding:2px;margin-left:auto"><input type="file" id="bfile" accept="image/*,.heic,.heif,.avif,.bmp,.svg,.tiff" hidden></div>
  <label for="bio">Bio</label><input id="bio" maxlength="80" placeholder="A few words about you">
  <label for="st">Status</label><input id="st" maxlength="60" placeholder="What are you up to?">
  <div class="sub" id="myId" style="margin-top:12px;cursor:pointer" title="Click to copy"></div>
  <label style="display:flex;gap:10px;align-items:flex-start;margin-top:16px;color:var(--text);font-size:14px"><input type="checkbox" id="rcpt" style="width:auto;margin-top:4px"><span>Read receipts<br><span class="sub" style="white-space:normal">Let others see when you’ve read their messages. If this is off, you won’t see when they read yours either.</span></span></label>
  <label style="display:flex;gap:10px;align-items:center;margin-top:12px;color:var(--text);font-size:14px"><input type="checkbox" id="sndOn" style="width:auto"> Play a sound for new messages and pings</label>
  <div id="saveMsg" style="color:#d9534f;font-size:13px;min-height:18px;margin-top:10px"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px"><button class="ghost" id="cancel" type="button">Cancel</button><button id="save" type="button">Save</button></div>
</dialog>

<div id="shorts" hidden>
 <div id="svMain"><button id="svBack" class="svb" type="button" title="Back"><span data-i="arrowleft"></span></button><button id="svMute" class="svb" type="button" title="Sound"><span data-i="volx"></span></button><div id="svFeed"></div></div>
 <aside id="svSide">
  <div class="banner" id="svBanner"></div>
  <div class="pavwrap" style="margin-top:-36px"><div class="av" id="svAv" style="width:72px;height:72px;font-size:30px;border:5px solid var(--panel)"></div></div>
  <div style="padding:10px 16px 0;flex:none"><div class="pname" id="svName" style="font-size:19px"></div><div class="sub" id="svUser"></div><div class="pbio" id="svBio" style="margin-top:6px"></div>
   <div style="display:flex;gap:8px;margin-top:10px"><button id="svMsgBtn" class="pbtn" type="button" style="margin:0"><span data-i="message"></span>Message</button><button id="svUpBtn" class="pbtn" type="button" style="margin:0"><span data-i="plus"></span>Upload short</button></div></div>
  <div class="plabel" style="padding:0 16px;margin:14px 0 2px;display:flex;justify-content:space-between;align-items:center"><span id="svCt">Comments</span><button class="ghost" id="svSheetX" type="button"><span data-i="x"></span></button></div>
  <div id="svCl"></div>
  <form id="svCf"><input id="svCi" maxlength="300" placeholder="Add a comment…" autocomplete="off"><button>Send</button></form>
 </aside>
</div>
<dialog id="svUpd"><h3 style="margin:0 0 6px">New short</h3>
 <input type="file" id="svFile" accept="video/*,.mov,.mkv,.avi,.3gp,.m4v,.wmv,.flv,.mpg,.mpeg,.ogv" hidden>
 <button class="ghost" id="svPick" type="button" style="padding-left:0">Choose a video</button><span class="sub" id="svFn"></span>
 <div id="svTrim" hidden>
  <video id="svPv" playsinline></video>
  <div class="sub" id="svWarn" style="white-space:normal;color:#d9534f"></div>
  <label>Trim start: <span id="svSt"></span></label><input type="range" id="svS" min="0" max="1" step="0.1" value="0" style="padding:0">
  <label>Trim end: <span id="svEt"></span></label><input type="range" id="svE" min="0" max="1" step="0.1" value="1" style="padding:0">
  <div class="sub" id="svLen" style="margin-top:6px"></div>
  <label for="svCap">Caption</label><input id="svCap" maxlength="120" placeholder="Say something (optional)">
 </div>
 <div id="svUm" style="color:#d9534f;font-size:13px;min-height:18px;margin-top:8px"></div>
 <div style="display:flex;gap:8px;justify-content:flex-end"><button class="ghost" id="svUc" type="button">Cancel</button><button id="svPost" type="button" disabled>Post</button></div>
</dialog>
<div id="incoming" hidden><div class="av" id="inAv"></div><div class="grow"><div class="name" id="inName"></div><div class="sub" id="inSub"></div></div><button class="clb ok" id="inYes" type="button" title="Accept"><span data-i="phone" data-s="22"></span></button><button class="clb no" id="inNo" type="button" title="Decline"><span data-i="phoneOff" data-s="22"></span></button></div>
<div id="call" hidden>
 <div id="clStage"></div>
 <div id="clBar"><div class="grow" style="min-width:140px"><div class="name" id="clTitle"></div><div class="sub" id="clSub"></div><div id="clPeople"></div></div>
  <button class="clb" id="clMin" type="button" title="Shrink / expand screen" hidden><span data-i="expand" data-s="20"></span></button>
  <button class="clb" id="clMic" type="button" title="Mute"><span data-i="mic" data-s="22"></span></button>
  <button class="clb" id="clScr" type="button" title="Share your screen (with audio)"><span data-i="monitor" data-s="22"></span></button>
  <button class="clb no" id="clEnd" type="button" title="Leave call"><span data-i="phoneOff" data-s="22"></span></button></div>
</div>
<div id="toasts"></div>
<dialog id="lb" style="padding:0;border:0;background:transparent;width:auto;max-width:96vw"><img id="lbImg" alt="" style="display:block;max-width:94vw;max-height:90vh;border-radius:12px;cursor:zoom-out"></dialog>
<input type="file" id="gfile" accept="image/*,.heic,.heif,.avif,.bmp,.svg,.tiff" hidden>

function insertAt(txt,from){const el=$("in"),pos=el.selectionStart,v=el.value;el.value=v.slice(0,from)+txt+v.slice(pos);const c=from+txt.length;el.setSelectionRange(c,c);el.focus()}
function pickAc(i){
  const el=$("in"),m=/:([a-z0-9_+-]{2,})$/.exec(el.value.slice(0,el.selectionStart));
  if(m&&acItems[i])insertAt(E[acItems[i]]+" ",m.index);
  hidePops();
}
$("in").oninput=()=>{
  const el=$("in"),before=el.value.slice(0,el.selectionStart);
  if(el.value.trim()&&tReady&&Date.now()-lastTyping>2000){lastTyping=Date.now();tch.send({type:"broadcast",event:"typing",payload:{from:me}})}
  const done=/:([a-z0-9_+-]+):$/.exec(before);
  if(done&&E[done[1]]){insertAt(E[done[1]],done.index);$("acpop").hidden=true;return}
  const m=/:([a-z0-9_+-]{2,})$/.exec(before),pop=$("acpop");
  if(!m){pop.hidden=true;return}
  const ks=Object.keys(E);
  acItems=ks.filter(k=>k.startsWith(m[1])).concat(ks.filter(k=>!k.startsWith(m[1])&&k.includes(m[1]))).slice(0,8);
  pop.textContent="";
  acItems.forEach((k,i)=>{const d=mk("div","ai"+(i?"":" on"),E[k]+"  :"+k+":");d.onmousedown=ev=>{ev.preventDefault();pickAc(i)};pop.append(d)});
  pop.hidden=!acItems.length;
};
$("in").onkeydown=e=>{
  if(!$("acpop").hidden&&(e.key==="Tab"||e.key==="Enter")){e.preventDefault();pickAc(0);return}
  if(e.key==="Escape")hidePops();
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("f").requestSubmit()}
};
function drawGrid(q){
  const g=$("eg");g.textContent="";
  Object.keys(E).filter(k=>k.includes(q)).forEach(k=>{const s=mk("span",null,E[k]);s.title=":"+k+":";s.onclick=()=>insertAt(E[k],$("in").selectionStart);g.append(s)});
}

function clearAtt(){att=null;$("attPrev").hidden=true;$("attPrev").textContent=""}
function setAtt(file){
  const im=new Image(),url=URL.createObjectURL(file);
  im.onload=()=>{
    const k=Math.min(1,1600/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k));
    const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");
    x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(url);
    c.toBlob(b=>{
      if(!b){toast("Couldn’t process that image.",true);return}
      const u=URL.createObjectURL(b);att={blob:b,url:u};
      const pv=$("attPrev");pv.textContent="";
      const t=new Image();t.src=u;t.alt="";t.style.cssText="height:64px;border-radius:8px;display:block";
      const rm=mk("button","ghost");rm.innerHTML=IC("x",16);rm.type="button";rm.onclick=clearAtt;
      pv.append(t,rm);pv.hidden=false;$("in").focus();
    },"image/jpeg",.85);
  };
  im.onerror=()=>{URL.revokeObjectURL(url);toast("Your browser couldn’t open that file. Try a JPG, PNG, GIF or WebP image.",true)};
  im.src=url;
}

$("f").onsubmit=async e=>{
  e.preventDefault();hidePops();
  const caption=emojify($("in").value.trim()),gid=activeG,to=active,a=att;
  if((!caption&&!a)||(!to&&!gid))return;
  $("in").value="";clearAtt();
  const cap=caption.slice(0,a?500:2000);
  const tmp={id:"tmp"+Date.now()+Math.random(),sender:me,recipient:to,group_id:gid,body:a?"[img]"+a.url+(cap?"\n"+cap:""):cap,created_at:new Date().toISOString(),pending:true};
  msgs.push(tmp);renderMsgs();
  const here=()=>gid?activeG===gid:active===to;
  let body=tmp.body;
  if(a){
    const path=me+"/chat/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+".jpg";
    const u=await sb.storage.from("avatars").upload(path,a.blob,{contentType:"image/jpeg"});

    body="[img]"+sb.storage.from("avatars").getPublicUrl(path).data.publicUrl+(cap?"\n"+cap:"");
  }
  const req=gid?sb.from("group_messages").insert({group_id:gid,body}):sb.from("messages").insert({recipient:to,body});
  const{data,error}=await req.select().single();
  if(!here())return;
  if(error){tmp.pending=false;tmp.failed=true;renderMsgs();return}
  seen.add(data.id);
  if(msgs.some(x=>x.id===data.id))msgs=msgs.filter(x=>x!==tmp);else{const i=msgs.indexOf(tmp);if(i>=0)msgs[i]=data}
  renderMsgs();
};

// cropper (drag to move, slider or wheel to zoom)
const C={img:null,s:1,min:1,x:0,y:0,w:0,h:0,ow:0,oh:0,round:false,cb:null};
function openCrop(file,o,cb){
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      Object.assign(C,{img:im,w:o.w,h:o.h,ow:o.ow,oh:o.oh,round:!!o.round,cb});
      const cv=$("cv");cv.width=C.w;cv.height=C.h;
      C.min=Math.max(C.w/im.width,C.h/im.height);C.s=C.min;C.x=(C.w-im.width*C.s)/2;C.y=(C.h-im.height*C.s)/2;
      $("zm").value=1;$("cropT").textContent=o.title;drawCrop();$("crop").showModal();
    };
    im.onerror=()=>toast("Your browser couldn’t open that file. Try a JPG, PNG, GIF, WebP or SVG image.",true);
    im.src=r.result;
  };
  r.readAsDataURL(file);
}
function drawCrop(){
  const iw=C.img.width*C.s,ih=C.img.height*C.s;
  C.x=Math.min(0,Math.max(C.w-iw,C.x));C.y=Math.min(0,Math.max(C.h-ih,C.y));
  const x=$("cv").getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,C.w,C.h);x.drawImage(C.img,C.x,C.y,iw,ih);
  if(C.round){
    x.fillStyle="rgba(0,0,0,.55)";x.beginPath();x.rect(0,0,C.w,C.h);x.arc(C.w/2,C.h/2,C.w/2-3,0,Math.PI*2,true);x.fill("evenodd");
    x.strokeStyle="rgba(255,255,255,.9)";x.lineWidth=2;x.beginPath();x.arc(C.w/2,C.h/2,C.w/2-3,0,Math.PI*2);x.stroke();
  }
}
$("zm").oninput=()=>{
  if(!C.img)return;
  const cx=(C.w/2-C.x)/C.s,cy=(C.h/2-C.y)/C.s;
  C.s=C.min*(+$("zm").value);C.x=C.w/2-cx*C.s;C.y=C.h/2-cy*C.s;drawCrop();
};
let drag=null;
$("cv").onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};$("cv").setPointerCapture(e.pointerId);$("cv").style.cursor="grabbing"};
$("cv").onpointermove=e=>{
  if(!drag)return;const k=C.w/$("cv").getBoundingClientRect().width;
  C.x+=(e.clientX-drag.x)*k;C.y+=(e.clientY-drag.y)*k;drag={x:e.clientX,y:e.clientY};drawCrop();
};
$("cv").onpointerup=$("cv").onpointercancel=()=>{drag=null;$("cv").style.cursor="grab"};
$("cv").onwheel=e=>{e.preventDefault();const z=$("zm");z.value=Math.min(4,Math.max(1,+z.value-e.deltaY*.002));z.oninput()};
$("cropCancel").onclick=()=>$("crop").close();
$("cropOk").onclick=()=>{
  const o=document.createElement("canvas");o.width=C.ow;o.height=C.oh;const x=o.getContext("2d"),k=C.ow/C.w;
  x.fillStyle="#fff";x.fillRect(0,0,C.ow,C.oh);
  x.drawImage(C.img,C.x*k,C.y*k,C.img.width*C.s*k,C.img.height*C.s*k);
  const url=o.toDataURL("image/jpeg",.85);
  o.toBlob(b=>{$("crop").close();if(C.cb)C.cb(b,url)},"image/jpeg",.85);
};

function closeChatView(){
  active=null;activeG=null;msgs=[];$("gpanel").hidden=true;$("chatTop").hidden=true;$("f").hidden=true;$("prof").hidden=true;$("app").classList.remove("chat");
  $("msgs").textContent="";$("msgs").append(mk("div","empty","Pick someone from the list to start a conversation."));renderList();

async function loadGroups(){
  const[g,m]=await Promise.all([sb.from("groups").select("*"),sb.from("group_members").select("group_id,user_id")]);
  if(g.error||m.error)return;
  const n={};(g.data||[]).forEach(x=>n[x.id]={...x,members:[]});
  (m.data||[]).forEach(x=>{if(n[x.group_id])n[x.group_id].members.push(x.user_id)});
  Object.keys(n).forEach(k=>{if(!n[k].members.includes(me))delete n[k]});
  G=n;renderList();
  if(activeG){if(G[activeG]){renderGroupHead();if(!$("gpanel").hidden)renderGroupInfo()}else closeChatView()}
}
function loadGroupsSoon(){clearTimeout(gT);gT=setTimeout(loadGroups,300)}
function startGroupLive(){
  sb.channel("live-groups")
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"group_messages"},x=>incomingG(x.new))
    .on("postgres_changes",{event:"*",schema:"public",table:"group_members"},loadGroupsSoon)
    .on("postgres_changes",{event:"*",schema:"public",table:"groups"},loadGroupsSoon)
    .subscribe();
}
function incomingG(m){
  if(!G[m.group_id])loadGroupsSoon();
  notify(m);
  if(m.group_id!==activeG||msgs.some(x=>x.id===m.id))return;
  msgs.push(m);renderMsgs();
}
function renderGroupHead(){
  const g=G[activeG];if(!g)return;
  setGroupAv($("pAv"),g);$("pName").textContent=g.name;
  $("pBio").textContent=g.members.length+" members · "+g.members.map(id=>id===me?"You":(P[id]||{}).name||"?").join(", ");
}
async function openGroup(gid){
  const g=G[gid];if(!g)return;
  clearAtt();clearUnread("g:"+gid);active=null;activeG=gid;msgs=[];otherRead=0;lastMine=null;seen=new Set();typingOn=false;clearTimeout(typingTimer);
  if(tch){sb.removeChannel(tch);tch=null}tReady=false;

function drawPick(box,qEl,sel,excl){
  const q=qEl.value.toLowerCase(),skip=new Set([me,...(excl||[])]);box.textContent="";
  const all=Object.values(P).filter(p=>!skip.has(p.id)&&(p.name+" "+p.username).toLowerCase().includes(q));
  const mkRow=p=>{
    const r=mk("div","row"),a=mk("div","av"),w=mk("div","grow"),c=mk("input");
    c.type="checkbox";c.style.width="auto";c.checked=sel.has(p.id);avatar(a,p,p.id,true);
    w.append(mk("div","name",p.name),mk("div","sub","@"+p.username));r.append(a,w,c);
    r.onclick=e=>{if(e.target!==c)c.checked=!c.checked;if(c.checked)sel.add(p.id);else sel.delete(p.id)};
    box.append(r);
  };
  const sec=(t,list,hint)=>{
    if(!list.length)return;
    const h=mk("div","slabel",t);h.style.padding="8px 4px 2px";box.append(h);
    if(hint){const e=mk("div","sub",hint);e.style.cssText="white-space:normal;padding:0 4px 4px";box.append(e)}
    list.forEach(mkRow);
  };
  sec("Friends",all.filter(p=>isFriend(p.id)));

}

$("gCreate").onclick=async()=>{

  if(!name){$("gname").focus();return}
  if(!gsel.size){sm.textContent="Pick at least one person.";return}
  $("gCreate").disabled=true;
  try{
    const r=await sb.from("groups").insert({name}).select().single();
    if(r.error)throw r.error;
    const ids=[...gsel],fr=ids.filter(isFriend),non=ids.filter(u=>!isFriend(u));

    if(m.error)throw m.error;
    if(gnBlob){const pr=await uploadGroupPhoto(r.data.id,gnBlob,gnUrl);if(pr.error)console.warn("Group photo failed:",pr.error.message)}

    $("gdlg").close();await loadGroups();openGroup(r.data.id);
  }catch(e){

function renderFeed(){

  SV.io=new IntersectionObserver(es=>es.forEach(e=>{
    const v=e.target.querySelector("video");

  }),{root:feed,threshold:[0,.6]});
  feed.querySelectorAll(".sv").forEach(el=>SV.io.observe(el));
  requestAnimationFrame(()=>{feed.style.scrollSnapType="none";feed.scrollTop=n*feed.clientHeight;requestAnimationFrame(()=>feed.style.scrollSnapType="y mandatory")});

function svItem(sh){

  });

// ---- calls (WebRTC; signalling over Supabase Realtime broadcast) ----
const ICE=[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]}];
let CALL=null,INC=null;const TX={};
function txChan(to){
  if(!TX[to]){const ch=sb.channel("calls-"+to);TX[to]={ch,ready:new Promise(res=>ch.subscribe(st=>{if(st==="SUBSCRIBED")res()}))}}
  return TX[to];
}
async function sig(to,p){const t=txChan(to);await t.ready;t.ch.send({type:"broadcast",event:"sig",payload:Object.assign({from:me,to},p)})}
function startCalls(){
  sb.channel("calls-"+me).on("broadcast",{event:"sig"},e=>{try{onSig(e.payload)}catch(x){console.warn(x)}}).subscribe();
  addEventListener("pagehide",()=>{if(CALL)endCall()});
}
function ringOnce(){
  if(!actx)return;
  try{const t=actx.currentTime;[0,.28].forEach((d,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=i?523:659;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.18,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.24);o.connect(g);g.connect(actx.destination);o.start(t+d);o.stop(t+d+.26)})}catch(e){}
}
function clearInc(){if(INC){clearInterval(INC.ri);clearTimeout(INC.to)}INC=null;$("incoming").hidden=true}
function onSig(p){
  if(!p||p.to!==me)return;
  const t=p.t;
  if(t==="ring"){
    if(CALL&&CALL.room===p.room)return;
    if(CALL||INC){sig(p.from,{t:"busy",room:p.room});return}
    const members=Array.isArray(p.members)?p.members:[p.from,me];
    INC={room:p.room,from:p.from,kind:p.kind,gid:p.gid,members,title:p.kind==="group"?(p.gname||"Group call"):((P[p.from]||{}).name||p.name||"Call")};
    const who=(P[p.from]||{}).name||p.name||"Someone";
    avatar($("inAv"),P[p.from],p.from,true);$("inName").textContent=p.kind==="group"?INC.title:who;$("inSub").textContent=p.kind==="group"?who+" started a voice call":"Incoming voice call…";
    $("incoming").hidden=false;ringOnce();INC.ri=setInterval(ringOnce,1800);INC.to=setTimeout(clearInc,45000);
    if(!(document.hasFocus()&&!document.hidden))sysNotify("Incoming call",{body:who+" is calling you",tag:"call",requireInteraction:true},{},()=>window.focus());
    return;
  }
  if(t==="cancel"){if(INC&&INC.room===p.room){clearInc();toast("Missed call from "+((P[p.from]||{}).name||"someone"))}return}
  if(!CALL||CALL.room!==p.room)return;
  if(t==="decline"||t==="busy"){
    CALL.ringing.delete(p.from);renderPeople();
    toast(((P[p.from]||{}).name||"They")+(t==="busy"?" is in another call":" declined the call"));
    if(CALL.kind==="dm")endCall();return;
  }
  if(t==="hello"){CALL.ringing.delete(p.from);peer(p.from);return}
  if(t==="bye"){dropPeer(p.from);return}
  if(t==="desc"||t==="ice")onDesc(p.from,p.desc,p.cand);
}
async function newCall(base){
  let ms;
  try{ms=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
  catch(e){toast("Couldn’t access your microphone. Allow it in your browser’s site settings (and use https).",true);return false}
  if(CALL){ms.getTracks().forEach(t=>t.stop());return false}
  try{if(AC&&!actx)actx=new AC();if(actx&&actx.state==="suspended")actx.resume()}catch(e){}
  CALL=Object.assign({local:ms,peers:{},tiles:{},av:{},mon:[],ringing:new Set(),muted:false,screen:null,started:0,live:false,mini:false},base);
  $("call").hidden=false;$("call").classList.remove("big");$("clStage").textContent="";
  $("clScr").hidden=!(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia);
  btnState();renderPeople();watch(me,ms);
  CALL.tick=setInterval(()=>{
    if(!CALL)return;
    const s=CALL.live?Math.floor((Date.now()-CALL.started)/1e3):0;
    $("clSub").textContent=CALL.live?"Connected · "+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"):(CALL.ringing.size?"Ringing…":"Connecting…");
  },500);
  return true;
}
async function startCall(o){
  const room=crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random(),g=o.gid?G[o.gid]:null;
  const members=o.gid?(g?g.members.slice():[]):[me,o.uid];
  if(members.filter(u=>u!==me).length===0){toast("There’s no one else in this group to call.");return}
  if(!(await newCall({room,kind:o.kind,gid:o.gid||null,members,title:o.gid?(g?g.name:"Group call"):((P[o.uid]||{}).name||"Call")})))return;
  members.filter(u=>u!==me).forEach(u=>{CALL.ringing.add(u);sig(u,{t:"ring",room,kind:o.kind,gid:o.gid||null,name:(P[me]||{}).name||"Someone",gname:g?g.name:"",members})});
  renderPeople();
  CALL.ringTimer=setTimeout(()=>{
    if(!CALL||CALL.room!==room)return;
    if(!Object.keys(CALL.peers).length){toast("No answer");endCall()}else{CALL.ringing.clear();renderPeople()}
  },45000);
}
async function acceptCall(){
  const i=INC;if(!i)return;clearInc();
  if(!(await newCall({room:i.room,kind:i.kind,gid:i.gid,members:i.members,title:i.title})))return;
  i.members.filter(u=>u!==me).forEach(u=>sig(u,{t:"hello",room:i.room}));
}
function declineCall(){const i=INC;if(!i)return;clearInc();sig(i.from,{t:"decline",room:i.room})}
function peer(uid){
  if(!CALL)return null;
  let st=CALL.peers[uid];if(st)return st;
  const room=CALL.room,pc=new RTCPeerConnection({iceServers:ICE});
  st=CALL.peers[uid]={pc,polite:me>uid,making:false,ignore:false,q:[],send:{}};
  CALL.local.getTracks().forEach(t=>pc.addTrack(t,CALL.local));
  if(CALL.screen)CALL.screen.getTracks().forEach(t=>{st.send[t.id]=pc.addTrack(t,CALL.screen)});
  pc.onicecandidate=e=>{if(e.candidate)sig(uid,{t:"ice",room,cand:e.candidate.toJSON()})};
  pc.onnegotiationneeded=async()=>{
    try{st.making=true;await pc.setLocalDescription();sig(uid,{t:"desc",room,desc:pc.localDescription.toJSON()})}
    catch(e){console.warn(e)}finally{st.making=false}
  };
  pc.ontrack=e=>addRemote(uid,e);
  pc.onconnectionstatechange=()=>{
    if(!CALL||CALL.peers[uid]!==st)return;
    if(pc.connectionState==="connected"&&!CALL.live){CALL.live=true;CALL.started=Date.now();clearTimeout(CALL.ringTimer)}
    if(pc.connectionState==="failed"||pc.connectionState==="closed")dropPeer(uid);
    if(pc.connectionState==="disconnected")setTimeout(()=>{if(CALL&&CALL.peers[uid]===st&&pc.connectionState==="disconnected")dropPeer(uid)},9000);
  };
  renderPeople();return st;
}
async function onDesc(from,desc,cand){
  const st=peer(from);if(!st)return;const pc=st.pc,room=CALL.room;
  try{
    if(desc){
      const collision=desc.type==="offer"&&(st.making||pc.signalingState!=="stable");
      st.ignore=!st.polite&&collision;if(st.ignore)return;
      await pc.setRemoteDescription(desc);
      for(const c of st.q.splice(0)){try{await pc.addIceCandidate(c)}catch(e){}}
      if(desc.type==="offer"){await pc.setLocalDescription();sig(from,{t:"desc",room,desc:pc.localDescription.toJSON()})}
    }else if(cand){
      if(!pc.remoteDescription){st.q.push(cand);return}
      try{await pc.addIceCandidate(cand)}catch(e){if(!st.ignore)console.warn(e)}
    }
  }catch(e){console.warn(e)}
}
function addRemote(uid,e){
  if(!CALL)return;
  const stream=e.streams[0]||new MediaStream([e.track]);let t=CALL.tiles[stream.id];
  if(!t){
    const tile=mk("div","ctile"),v=document.createElement("video");v.autoplay=true;v.playsInline=true;v.srcObject=stream;
    tile.append(v,mk("span",null,((P[uid]||{}).name||"?")+" — screen"));tile.hidden=true;
    tile.ondblclick=()=>{if(tile.requestFullscreen)tile.requestFullscreen()};
    $("clStage").append(tile);t=CALL.tiles[stream.id]={tile,v,uid,stream};
    stream.onaddtrack=stream.onremovetrack=()=>tileRefresh(t);

  const tr=e.track;tr.onmute=tr.onunmute=tr.onended=()=>tileRefresh(t);

  v_play(t);tileRefresh(t);
}
function v_play(t){t.v.play().catch(()=>{})}
function tileRefresh(t){
  const live=t.stream.getVideoTracks().some(x=>x.readyState==="live"&&!x.muted);
  t.tile.hidden=!live;refreshStage();
}
function refreshStage(){
  if(!CALL)return;const n=Object.values(CALL.tiles).filter(t=>!t.tile.hidden).length;
  $("call").classList.toggle("big",n>0&&!CALL.mini);$("clMin").hidden=!n;
}
function watch(uid,stream){
  try{
    if(!actx||!stream.getAudioTracks().length)return;
    const src=actx.createMediaStreamSource(stream),an=actx.createAnalyser();an.fftSize=256;src.connect(an);
    const buf=new Uint8Array(an.frequencyBinCount);
    CALL.mon.push(setInterval(()=>{
      if(!CALL)return;an.getByteFrequencyData(buf);let a=0;for(const x of buf)a+=x;
      const el=CALL.av[uid];if(el)el.classList.toggle("talk",a/buf.length>14&&!(uid===me&&CALL.muted));
    },150));
  }catch(e){}
}
function renderPeople(){

    const a=mk("div","av");avatar(a,P[u],u,true);a.title=((P[u]||{}).name||"?")+(CALL.ringing.has(u)?" (ringing)":"");

function dropPeer(uid){

function endCall(msg){

function btnState(){

  $("clScr").innerHTML=IC(CALL.screen?"monitorOff":"monitor",22);$("clScr").classList.toggle("on",!!CALL.screen);

async function shareScreen(){
  if(!CALL)return;
  if(CALL.screen){stopScreen();return}

function mentionCheck(){
  const el=$("in"),before=el.value.slice(0,el.selectionStart),m=/(^|\s)@([A-Za-z0-9_.-]*)$/.exec(before),pop=$("acpop");
  mActive=false;if(!m)return;

  const pool=activeG&&G[activeG]?G[activeG].members.filter(u=>u!==me).map(u=>P[u]).filter(Boolean):(active&&P[active]?[P[active]]:[]);
  const items=pool.filter(p=>p.username&&(p.username.toLowerCase().includes(q)||String(p.name).toLowerCase().includes(q))).slice(0,6);
  if(activeG&&"everyone".startsWith(q))items.unshift({username:"everyone",name:"Notify everyone in this group"});
  if(!items.length)return;
  mItems=items;mActive=true;pop.textContent="";
  items.forEach((p,i)=>{const d=mk("div","ai"+(i?"":" on"),"@"+p.username+"  ·  "+p.name);d.onmousedown=ev=>{ev.preventDefault();pickMention(i)};pop.append(d)});
  pop.hidden=false;
}
function pickMention(i){
  const el=$("in"),m=/(^|\s)@([A-Za-z0-9_.-]*)$/.exec(el.value.slice(0,el.selectionStart));
  if(m&&mItems[i])insertAt("@"+mItems[i].username+" ",m.index+m[1].length);
  hidePops();mActive=false;
}
const _oi=$("in").oninput,_ok=$("in").onkeydown;
$("in").oninput=()=>{_oi();mentionCheck()};
$("in").onkeydown=e=>{

async function start(id){
  me=id;$("auth").hidden=true;$("app").hidden=false;syncNotif();startPresence();startCalls();
  const{data,error}=await sb.from("profiles").select("*");
  if(error){$("list").textContent="Couldn’t load people.";return}
  P={};data.forEach(p=>P[p.id]=p);renderMe();renderList();loadGroups();startGroupLive();loadFriends();startFriendLive();
  sb.channel("live")
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"recipient=eq."+me},x=>incoming(x.new))
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"sender=eq."+me},x=>incoming(x.new))
    .on("postgres_changes",{event:"*",schema:"public",table:"reads",filter:"other=eq."+me},x=>{
      if(x.new&&x.new.reader===active){otherRead=Date.parse(x.new.last_read);placeRead()}})
    .on("postgres_changes",{event:"*",schema:"public",table:"profiles"},x=>{
      if(x.new&&x.new.id){P[x.new.id]=x.new;renderMe();renderList();if(active){renderHead();placeRead()}}})
    .subscribe();
}
async function init(){
  if(SUPABASE_URL.includes("YOUR-PROJECT")){$("auth").hidden=false;msg("Set SUPABASE_URL at the top of the script first.");return}
  sb=createClient(SUPABASE_URL,KEY);
  const{data:{session}}=await sb.auth.getSession();
  if(session)start(session.user.id);else $("auth").hidden=false;
}
init();
</script>
